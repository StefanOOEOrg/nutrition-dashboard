[project]
name = "nutrition-dashboard"
version = "0.1.0"
description = "Read-only dashboard for today's nutrition: calories, macros and water from the mcp-nutrition diary"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.37,<1",
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
nutrition-dashboard = "nutrition_dashboard.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28,<1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/nutrition_dashboard"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
